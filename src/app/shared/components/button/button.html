<button
  [matButton]="variant() === 'filled' ? 'filled' : 'outlined'"
  [type]="type()"
  [disabled]="disabled()"
  [class.app-button--full]="fullWidth()"
  class="app-button"
  (click)="onClick($event)"
>
  <span class="app-button-content">
    @if (variant() === 'google') {
      <img
        src="google.svg"
        alt="Google"
        class="app-button-google-icon"
      />
    } @else {
      <ng-content select="[buttonIcon]" />
    }
    <ng-content />
  </span>
</button>
